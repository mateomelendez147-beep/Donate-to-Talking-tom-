<!DOCTYPE html> <html lang="es"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Error 404 - Página no encontrada</title>     <style>         * {             margin: 0;             padding: 0;             box-sizing: border-box;         }          body {             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;             background-color: #f4f6f9;             color: #333;             display: flex;             justify-content: center;             align-items: center;             height: 100vh;             padding: 20px;         }          .container {             text-align: center;             max-width: 600px;             width: 100%;         }          .error-code {             font-size: 120px;             font-weight: 900;             color: #2c3e50;             line-height: 1;             margin-bottom: 10px;             animation: float 4s ease-in-out infinite;         }          .error-title {             font-size: 24px;             font-weight: 700;             color: #e74c3c;             margin-bottom: 15px;             text-transform: uppercase;             letter-spacing: 1px;         }          .error-message {             font-size: 16px;             color: #7f8c8d;             margin-bottom: 30px;             line-height: 1.6;         }          .btn-home {             display: inline-block;             padding: 12px 30px;             background-color: #3498db;             color: #fff;             text-decoration: none;             font-weight: 600;             border-radius: 25px;             transition: all 0.3s ease;             box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);         }          .btn-home:hover {             background-color: #2980b9;             transform: translateY(-2px);             box-shadow: 0 6px 12px rgba(41, 128, 185, 0.3);         }          .btn-home:active {             transform: translateY(0);         }          /* Animación sutil para el número 404 */         @keyframes float {             0%, 100% {                 transform: translateY(0);             }             50% {                 transform: translateY(-10px);             }         }          /* Adaptación para pantallas pequeñas */         @media (max-width: 480px) {             .error-code {                 font-size: 90px;             }             .error-title {                 font-size: 20px;             }             .error-message {                 font-size: 14px;             }         }     </style> </head> <body>      <div class="container">         <div class="error-code">404</div>         <h1 class="error-title">Página no encontrada</h1>         <p class="error-message">             Lo sentimos, la página que estás buscando no existe, ha sido eliminada o cambió de dirección temporalmente.         </p>         <a href="/" class="btn-home">Volver al Inicio</a>     </div>  </body> </html>
